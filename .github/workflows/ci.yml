name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Nenhum segredo pode ir parar no código que o navegador baixa.
      - name: Bundle sem segredos
        run: |
          if grep -rlE "ENCRYPTION_KEY|VERCEL_TOKEN" .next/static; then
            echo "::error::Segredo encontrado no bundle do navegador"; exit 1
          fi
