name: Deploy

# Publica na Vercel (plano Hobby, gratuito) depois que o CI passa na main.
# Também dá para disparar à mão: Actions → Deploy → Run workflow.
# Secrets necessários no repositório: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# (o scripts/publicar.sh cadastra os três). A ENCRYPTION_KEY fica nas variáveis de
# ambiente do projeto na Vercel, não no GitHub.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_CLI: vercel@63.1.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npx --yes $VERCEL_CLI pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx --yes $VERCEL_CLI build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Publicar
        run: |
          url=$(npx --yes $VERCEL_CLI deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Publicado: $url" >> "$GITHUB_STEP_SUMMARY"
